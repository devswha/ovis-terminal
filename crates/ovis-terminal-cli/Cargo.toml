[package]
name = "ovis-terminal-cli"
description = "Agent-facing ovis-terminal command-line interface and binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
autobins = false

[[bin]]
name = "ovis-terminal"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ovis-terminal-authz = { workspace = true }
ovis-terminal-holder = { workspace = true }
ovis-terminal-protocol = { workspace = true }
ovis-terminal-remote = { workspace = true }
ovis-terminal-server = { workspace = true }

# The assembled server (`serve`) and the attach client are Unix-only in this build.
[target.'cfg(unix)'.dependencies]
base64 = { workspace = true }
ovis-terminal-agent = { workspace = true }
ovis-terminal-core = { workspace = true }
ovis-terminal-services = { workspace = true }
ovis-terminal-store = { workspace = true }
ovis-terminal-vt = { workspace = true }
# Raw mode, window size and TTY checks of the outer terminal; the version the holder resolves.
rustix = { version = "1.1.6", features = ["process", "stdio", "termios"] }
uuid = { workspace = true }

# The named-pipe client waits out a busy instance with WaitNamedPipeW, as the Windows
# pipe contract requires; the version Cargo.lock already resolves.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }

# The Windows service fixture test (plan todo 54) logs on as its account and owns a
# launch job; the version Cargo.lock already resolves.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

# The attach tests drive the client on a real outer PTY; the version the holder resolves.
[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.6", features = ["event", "fs", "process", "pty", "stdio", "termios"] }

[dev-dependencies]
proptest = { workspace = true }
ovis-terminal-core = { workspace = true }

[lints]
workspace = true
