[package]
name = "ovis-terminal-cli"
description = "Agent-facing ovis-terminal command-line interface and binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
autobins = false

[[bin]]
name = "ovis-terminal"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
ovis-terminal-holder = { workspace = true }
ovis-terminal-protocol = { workspace = true }
ovis-terminal-server = { workspace = true }

# The Windows service fixture test (plan todo 54) logs on as its account and owns a
# launch job; the version Cargo.lock already resolves.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }

[dev-dependencies]
proptest = { workspace = true }
ovis-terminal-authz = { workspace = true }
ovis-terminal-core = { workspace = true }

[lints]
workspace = true
