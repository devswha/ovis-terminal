[package]
name = "ovis-terminal-server"
description = "Authenticated persistent endpoints, strict dispatch, streams and WebSocket transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
ovis-terminal-protocol = { workspace = true }
ovis-terminal-holder = { workspace = true }
ovis-terminal-core = { workspace = true }
ovis-terminal-authz = { workspace = true }
ovis-terminal-agent = { workspace = true }
ovis-terminal-agent-adapters = { workspace = true }
ovis-terminal-services = { workspace = true }
ovis-terminal-remote = { workspace = true }
ovis-terminal-store = { workspace = true }
ovis-terminal-vt = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

# SO_NOSIGPIPE through a safe API; the version tokio already resolves.
[target.'cfg(target_vendor = "apple")'.dependencies]
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
proptest = { workspace = true }
uuid = { workspace = true }
# Paused virtual time drives the unreachable-endpoint deadline without a real wait.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
