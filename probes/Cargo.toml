[package]
name = "ovis-terminal-probes"
description = "Native platform probes for PTY, process and VT behavior."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# Quality gates (plan todo 61): thin mains over `ovis_terminal_probes::quality`.
[[bin]]
name = "source-check"
path = "quality/bin/source_check.rs"

[[bin]]
name = "evidence-audit"
path = "quality/bin/evidence_audit.rs"

[[bin]]
name = "plan-audit"
path = "quality/bin/plan_audit.rs"

[[bin]]
name = "ideal-audit"
path = "quality/bin/ideal_audit.rs"

[[bin]]
name = "quality-matrix"
path = "quality/bin/quality_matrix.rs"

[[test]]
name = "quality_gates"
path = "quality/tests/gates.rs"

[[test]]
name = "quality_repository"
path = "quality/tests/repository.rs"

[[test]]
name = "quality_evidence"
path = "quality/tests/evidence_tree.rs"

[dependencies]
clap = { workspace = true }
ovis-terminal-holder = { workspace = true }
ovis-terminal-vt = { workspace = true }
portable-pty = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
syn = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
workspace-hygiene = { workspace = true }

[target.'cfg(windows)'.dependencies]
tokio = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

# Used by probes/platform/ and probes/quality/, which src/lib.rs loads through #[path];
# machete scans only src/.
[package.metadata.cargo-machete]
ignored = ["clap", "portable-pty", "proc-macro2", "quote", "serde", "serde_json", "sha2", "syn", "thiserror", "tracing", "workspace-hygiene"]

[lints]
workspace = true
