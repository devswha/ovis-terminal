# probe-stress-macos.yml addition for todo 29: append `client-ts` to the probe options list and this job at the end.
  client-ts:
    if: inputs.probe == 'client-ts'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: generated SDK check, then the Bun suite 25 times
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p ovis-terminal-cli --bin ovis-terminal -p ovis-terminal-conformance --bin conformance
          bun install --frozen-lockfile
          cd packages/client-ts
          {
            uname -a
            bun --version
            git rev-parse HEAD
            bun run generate:check
            bun run typecheck
            for iteration in $(seq 1 25); do
              printf '\nITERATION %s/25\n' "$iteration"
              bun test
              printf 'PASS %s/25\n' "$iteration"
            done
            printf 'RESULT 25/25\n'
          } 2>&1 | tee ../../client-ts-stress-macos.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-ts-stress-macos-${{ github.run_id }}
          path: client-ts-stress-macos.log
          if-no-files-found: error
