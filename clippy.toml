cognitive-complexity-threshold = 25
type-complexity-threshold = 250
too-many-arguments-threshold = 3
too-many-lines-threshold = 100

msrv = "1.89"

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
# portable-pty 0.9 still pulls bitflags 1 and thiserror 1 (with syn 2) beside the workspace majors.
allowed-duplicate-crates = ["windows-sys", "bitflags", "syn", "thiserror", "thiserror-impl"]

single-char-binding-names-threshold = 4

# Product terms that are not code identifiers in doc comments; ".." keeps the defaults.
doc-valid-idents = ["OpenRPC", "ConPTY", ".."]
