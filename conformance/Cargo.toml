[package]
name = "ovis-terminal-conformance"
description = "Real-socket conformance runner that drives the ovis-terminal binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true
autobins = false
autotests = false

[[bin]]
name = "conformance"
path = "src/main.rs"

# Process tests of the real runner binary against the real ovis-terminal binary.
[[test]]
name = "runner"
path = "src/runner_tests.rs"

[dependencies]
# Decodes `terminal.output` pages; the version Cargo.lock already resolves.
base64 = "0.22"
clap = { workspace = true }
ovis-terminal-agent = { workspace = true }
ovis-terminal-authz = { workspace = true }
ovis-terminal-core = { workspace = true }
ovis-terminal-holder = { workspace = true }
# The quality gates (todo 61) run in-process in the `gates` step.
ovis-terminal-probes = { workspace = true }
ovis-terminal-protocol = { workspace = true }
ovis-terminal-remote = { workspace = true }
# The transport-neutral replay of the Ovis consumer fixtures (todo 64).
ovis-terminal-replay = { workspace = true }
ovis-terminal-server = { workspace = true }
ovis-terminal-services = { workspace = true }
ovis-terminal-store = { workspace = true }
ovis-terminal-vt = { workspace = true }
# Release staging (todo 67) runs in-process in the `release` step.
release-stage = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

# Outer PTYs for the attach steps, and stopping the fixture's peer runtime; the version
# the holder resolves.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process", "pty", "stdio", "termios"] }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
