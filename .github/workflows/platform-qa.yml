name: platform-qa

# First-class platform QA on freshly built binaries (plan todo 60).
# unix-full (ubuntu, macos): every non-Windows conformance scenario family, the
# platform/matrix happy and failure cases with the literal generation injections,
# and the Unix service, logout and SSH-loopback service tests. Every command's exit
# code, stdout, stderr and the binary hashes are archived; any non-zero exit or
# skipped case fails the job.
# windows-smoke (windows-2025): the contract smoke tier from
# probes/platform-qa/windows-smoke.json, run by the windows-smoke binary; a check
# whose prerequisite is missing fails instead of skipping. It is not full Windows
# manual QA. verify-ci reads this job's windows-smoke artifact.

on:
  pull_request:
  push:
    branches: [integration, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  unix-full:
    name: unix-full (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            image: ubuntu-24.04
          - os: macos-latest
            image: macos-15
    runs-on: ${{ matrix.image }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: pin C toolchain (Linux gcc 14.2.0)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test "$(gcc-14 -dumpfullversion)" = "14.2.0"
          {
            echo "CC=gcc-14"
            echo "AR=gcc-ar-14"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc-14"
          } >> "$GITHUB_ENV"
      - name: pin C toolchain (macOS Xcode 16.4)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          version="$(xcodebuild -version)"
          test "${version%%$'\n'*}" = "Xcode 16.4"
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: build the binary and the conformance runner
        run: cargo build --locked -p ovis-terminal-cli --bin ovis-terminal -p ovis-terminal-conformance --bin conformance
      - name: platform QA
        shell: bash
        run: bash probes/platform-qa/unix-full.sh qa-out
      - name: summary
        if: always()
        shell: bash
        run: |
          {
            echo "### unix-full ${{ matrix.os }} ($(uname -sm))"
            if test -f qa-out/exits.tsv; then
              echo '```'
              cat qa-out/exits.tsv
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-qa-${{ matrix.os }}-${{ github.run_id }}
          path: qa-out/
          if-no-files-found: error

  windows-smoke:
    name: windows-smoke
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: pin C toolchain (Windows MSVC 14.44)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: "14.44"
      - name: use the pinned MSVC linker
        shell: bash
        run: |
          linker="${VCToolsInstallDir}bin\HostX64\x64\link.exe"
          test -f "$linker"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: CI-owned service account and binary location (no interactive login)
        shell: pwsh
        run: |
          $password = "Ov1s-" + [guid]::NewGuid().ToString("N") + "!a"
          Write-Output "::add-mask::$password"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name ovis54ci -Password $secure -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member ovis54ci
          New-Item -ItemType Directory -Force C:\ovis54\state | Out-Null
          icacls C:\ovis54 /grant "ovis54ci:(OI)(CI)M" | Out-Null
          "OVIS54_ACCOUNT=.\ovis54ci" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OVIS54_PASSWORD=$password" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OVIS54_BINARY=C:\ovis54\ovis-terminal.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OVIS54_STATE=C:\ovis54\state" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: build the binary for the service fixture
        shell: bash
        run: |
          cargo build --locked -p ovis-terminal-cli --bin ovis-terminal
          cp target/debug/ovis-terminal.exe /c/ovis54/ovis-terminal.exe
          sha256sum target/debug/ovis-terminal.exe
      - name: windows contract smoke
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          uname -a
          # Each check's cargo test rebuilds the probes binaries, and Windows cannot replace a
          # running executable, so the runner runs as a copy outside the target directory.
          cargo build --locked --manifest-path probes/Cargo.toml --bin windows-smoke
          cp target/debug/windows-smoke.exe "$RUNNER_TEMP/windows-smoke.exe"
          "$RUNNER_TEMP/windows-smoke.exe" \
            --manifest probes/platform-qa/windows-smoke.json --out windows-smoke --sha "$HEAD_SHA" \
            | tee windows-smoke-summary.log
      - name: summary
        if: always()
        shell: bash
        run: |
          {
            echo "### windows-smoke ($(uname -sm)): smoke tier, not full Windows manual QA"
            echo '```'
            cat windows-smoke-summary.log 2>/dev/null || echo "no summary"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: remove the fixture service and account
        if: always()
        shell: pwsh
        run: |
          sc.exe stop ovis-terminal-holder-ci54 | Out-Null
          sc.exe delete ovis-terminal-holder-ci54 | Out-Null
          Remove-LocalUser -Name ovis54ci -ErrorAction SilentlyContinue
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: windows-smoke/
          if-no-files-found: error
