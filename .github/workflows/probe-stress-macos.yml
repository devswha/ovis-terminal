name: probe-stress-macos

# One data-driven stress job. A lane is probes/platform-qa/stress/<lane>.json (runner
# variants, timeout, setup) plus <lane>.sh (the repeated commands). Adding a lane adds
# those two files and edits nothing here, so lane PRs no longer conflict on this file.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Stress lane (a file name under probes/platform-qa/stress/ without .json)
        type: string
        default: platform

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  resolve:
    name: resolve lane ${{ inputs.probe }}
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.lane.outputs.matrix }}
      timeout: ${{ steps.lane.outputs.timeout }}
      setup: ${{ steps.lane.outputs.setup }}
    steps:
      - uses: actions/checkout@v4
      - id: lane
        shell: bash
        env:
          PROBE: ${{ inputs.probe }}
        run: python3 probes/platform-qa/stress/resolve.py "$PROBE" >> "$GITHUB_OUTPUT"

  stress:
    needs: resolve
    name: stress (${{ inputs.probe }}, ${{ matrix.runs_on }}${{ matrix.variant != '' && format(', {0}', matrix.variant) || '' }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: ${{ fromJSON(needs.resolve.outputs.timeout) }}
    steps:
      - uses: actions/checkout@v4
      - name: pin C toolchain (Xcode)
        if: matrix.xcode != ''
        shell: bash
        env:
          XCODE: ${{ matrix.xcode }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"
          version="$(xcodebuild -version)"
          test "${version%%$'\n'*}" = "Xcode $XCODE"
      - name: pin C toolchain (Windows MSVC 14.44)
        if: contains(fromJSON(needs.resolve.outputs.setup), 'msvc')
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: "14.44"
      - name: use the pinned MSVC linker
        if: contains(fromJSON(needs.resolve.outputs.setup), 'msvc')
        shell: bash
        run: |
          linker="${VCToolsInstallDir}bin\HostX64\x64\link.exe"
          test -f "$linker"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - if: contains(fromJSON(needs.resolve.outputs.setup), 'bun')
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: CI-owned service account and binary location (no interactive login)
        if: contains(fromJSON(needs.resolve.outputs.setup), 'windows-service-account')
        shell: pwsh
        run: |
          $password = "Ov1s-" + [guid]::NewGuid().ToString("N") + "!a"
          Write-Output "::add-mask::$password"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name ovis54ci -Password $secure -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member ovis54ci
          New-Item -ItemType Directory -Force C:\ovis54\state | Out-Null
          icacls C:\ovis54 /grant "ovis54ci:(OI)(CI)M" | Out-Null
          "OVIS54_ACCOUNT=.\ovis54ci" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OVIS54_PASSWORD=$password" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OVIS54_BINARY=C:\ovis54\ovis-terminal.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OVIS54_STATE=C:\ovis54\state" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: run lane ${{ inputs.probe }}
        shell: bash
        env:
          PROBE: ${{ inputs.probe }}
          STRESS_VARIANT: ${{ matrix.variant }}
        run: bash "probes/platform-qa/stress/${PROBE}.sh"
      - name: summary
        if: always()
        shell: bash
        run: |
          grep -hE '^(PASS|RESULT|ITERATION) ' ./*.log packages/client-ts/*.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
      - name: remove the fixture service and account
        if: always() && contains(fromJSON(needs.resolve.outputs.setup), 'windows-service-account')
        shell: pwsh
        run: |
          sc.exe stop ovis-terminal-holder-ci54 | Out-Null
          sc.exe delete ovis-terminal-holder-ci54 | Out-Null
          Remove-LocalUser -Name ovis54ci -ErrorAction SilentlyContinue
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stress-${{ inputs.probe }}-${{ matrix.runs_on }}${{ matrix.variant != '' && format('-{0}', matrix.variant) || '' }}-${{ github.run_id }}
          path: ./*.log
          if-no-files-found: error
