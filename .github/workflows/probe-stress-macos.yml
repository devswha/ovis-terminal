name: probe-stress-macos

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Stress selection
        type: choice
        default: platform
        options: [platform, holder-shutdown, screen, leases, layout, cli, encoding, input, conformance, plugins, agent-status, subscriptions, machine-identity, ops-cancel, unix-service, docs-retention, session-binding, conpty, ops-digest, ops-admission, connection, windows-service, prompts, geometry, restart, template-launch, agent-tree, credential-rotation, process-info, waits, client-ts, prompt-bridge, recovery, update, machine-actor, conversation-records, health, commit-barrier]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  stress:
    if: inputs.probe == 'platform'
    name: stress (${{ matrix.image }}, ${{ matrix.probe }})
    strategy:
      fail-fast: false
      matrix:
        probe: [happy, all]
        image: [macos-latest, macos-15]
        include:
          - image: macos-latest
            xcode: "26.6"
          - image: macos-15
            xcode: "16.4"
    runs-on: ${{ matrix.image }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: pin C toolchain
        shell: bash
        env:
          XCODE: ${{ matrix.xcode }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE}.app"
          version="$(xcodebuild -version)"
          test "${version%%$'\n'*}" = "Xcode $XCODE"
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: repeat probe 100 times (fail fast)
        shell: bash
        env:
          PROBE: ${{ matrix.probe }}
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            for iteration in $(seq 1 100); do
              printf '\nITERATION %s/100\n' "$iteration"
              if test "$PROBE" = happy; then
                cargo nextest run -p ovis-terminal-holder --test platform_probe happy --locked
              else
                cargo nextest run -p ovis-terminal-holder --test platform_probe --locked
              fi
              printf 'PASS %s/100\n' "$iteration"
            done
            printf 'RESULT 100/100\n'
          } 2>&1 | tee probe-stress-macos.log
      - name: summary
        if: always()
        shell: bash
        run: |
          if test -f probe-stress-macos.log; then
            grep -E '^(PASS|RESULT|ITERATION) ' probe-stress-macos.log >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-stress-macos-${{ matrix.image }}-${{ matrix.probe }}-${{ github.run_id }}
          path: probe-stress-macos.log
          if-no-files-found: error
  screen:
    if: inputs.probe == 'screen'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: repeat screen tests 100 times
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            for iteration in $(seq 1 100); do
              printf '\nITERATION %s/100\n' "$iteration"
              cargo nextest run -p ovis-terminal-core --test screen --locked --no-tests=fail
              printf 'PASS %s/100\n' "$iteration"
            done
            printf 'RESULT 100/100\n'
          } 2>&1 | tee screen-stress-macos.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-stress-${{ github.run_id }}
          path: screen-stress-macos.log
          if-no-files-found: error
  leases:
    if: inputs.probe == 'leases'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: repeat lease ownership tests 100 times
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            for iteration in $(seq 1 100); do
              printf '\nITERATION %s/100\n' "$iteration"
              cargo nextest run -p ovis-terminal-core --test leases --locked --no-tests=fail
              printf 'PASS %s/100\n' "$iteration"
            done
            printf 'RESULT 100/100\n'
          } 2>&1 | tee leases-stress.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: leases-stress-${{ github.run_id }}
          path: leases-stress.log
          if-no-files-found: error
  holder-shutdown:
    if: inputs.probe == 'holder-shutdown'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: repeat holder shutdown 200 times
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            cargo nextest run -p ovis-terminal-holder --locked --lib --no-tests=fail
            for iteration in $(seq 1 200); do
              printf '\nITERATION %s/200\n' "$iteration"
              cargo nextest run -p ovis-terminal-holder --locked --lib \
                -E 'test(newer_fence_revokes_queued_input_behind_a_blocked_write) | test(/shutdown_tests::/)' \
                --no-tests=fail --success-output immediate
              printf 'PASS %s/200\n' "$iteration"
            done
            printf 'RESULT 200/200\n'
          } 2>&1 | tee macos-stress.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: holder-shutdown-${{ github.run_id }}
          path: macos-stress.log
          if-no-files-found: error
  layout:
    if: inputs.probe == 'layout'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: repeat layout acceptance 100 times
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            for iteration in $(seq 1 100); do
              printf '\nITERATION %s/100\n' "$iteration"
              cargo nextest run -p ovis-terminal-core --test layout --locked --no-tests=fail
              printf 'PASS %s/100\n' "$iteration"
            done
            printf 'RESULT 100/100\n'
          } 2>&1 | tee layout-stress.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-stress-${{ github.run_id }}
          path: layout-stress.log
          if-no-files-found: error
  cli:
    if: inputs.probe == 'cli'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: repeat CLI process tests 100 times
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            for iteration in $(seq 1 100); do
              printf '\nITERATION %s/100\n' "$iteration"
              cargo nextest run -p ovis-terminal-cli --locked --no-tests=fail --success-output immediate
              printf 'PASS %s/100\n' "$iteration"
            done
            printf 'RESULT 100/100\n'
          } 2>&1 | tee cli-stress-macos.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-stress-macos-${{ github.run_id }}
          path: cli-stress-macos.log
          if-no-files-found: error
  encoding:
    if: inputs.probe == 'encoding'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: repeat input encoding tests 100 times
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            for iteration in $(seq 1 100); do
              printf '\nITERATION %s/100\n' "$iteration"
              cargo nextest run -p ovis-terminal-core --test encoding --locked --no-tests=fail
              printf 'PASS %s/100\n' "$iteration"
            done
            printf 'RESULT 100/100\n'
          } 2>&1 | tee encoding-stress.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encoding-stress-${{ github.run_id }}
          path: encoding-stress.log
          if-no-files-found: error
  input:
    if: inputs.probe == 'input'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: repeat ordered input tests 100 times
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            for iteration in $(seq 1 100); do
              printf '\nITERATION %s/100\n' "$iteration"
              cargo nextest run -p ovis-terminal-core --test input --locked --no-tests=fail
              printf 'PASS %s/100\n' "$iteration"
            done
            printf 'RESULT 100/100\n'
          } 2>&1 | tee input-stress.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-stress-${{ github.run_id }}
          path: input-stress.log
          if-no-files-found: error
  conformance:
    if: inputs.probe == 'conformance'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: repeat conformance runner tests 25 times
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            cargo build --locked -p ovis-terminal-cli --bin ovis-terminal
            for iteration in $(seq 1 25); do
              printf '\nITERATION %s/25\n' "$iteration"
              cargo nextest run -p ovis-terminal-conformance --all-targets --locked --no-tests=fail
              printf 'PASS %s/25\n' "$iteration"
            done
            printf 'RESULT 25/25\n'
          } 2>&1 | tee conformance-stress-macos.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-stress-macos-${{ github.run_id }}
          path: conformance-stress-macos.log
          if-no-files-found: error
  plugins:
    if: inputs.probe == 'plugins'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: repeat plugin run and lane tests 100 times
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            for iteration in $(seq 1 100); do
              printf '\nITERATION %s/100\n' "$iteration"
              cargo nextest run -p ovis-terminal-services -p ovis-terminal-server --lib -E 'test(/plugins::/)' --locked --no-tests=fail
              printf 'PASS %s/100\n' "$iteration"
            done
            printf 'RESULT 100/100\n'
          } 2>&1 | tee plugins-stress-macos.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugins-stress-macos-${{ github.run_id }}
          path: plugins-stress-macos.log
          if-no-files-found: error
  agent-status:
    if: inputs.probe == 'agent-status'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: repeat agent status tests and the agent/status scenario 50 times
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            cargo build --locked -p ovis-terminal-cli --bin ovis-terminal
            cargo build --locked --manifest-path conformance/Cargo.toml --bin conformance
            for iteration in $(seq 1 50); do
              printf '\nITERATION %s/50\n' "$iteration"
              cargo test --locked -q -p ovis-terminal-agent
              target/debug/conformance --binary target/debug/ovis-terminal --scenario agent/status \
                --isolated --case all --evidence "agent-status-$iteration.json"
              printf 'PASS %s/50\n' "$iteration"
            done
            printf 'RESULT 50/50\n'
          } 2>&1 | tee agent-status-stress-macos.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-status-stress-macos-${{ github.run_id }}
          path: agent-status-stress-macos.log
          if-no-files-found: error
  subscriptions:
    if: inputs.probe == 'subscriptions'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: repeat subscription tests 100 times
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            for iteration in $(seq 1 100); do
              printf '\nITERATION %s/100\n' "$iteration"
              cargo nextest run -p ovis-terminal-core --test subscriptions --locked --no-tests=fail
              printf 'PASS %s/100\n' "$iteration"
            done
            printf 'RESULT 100/100\n'
          } 2>&1 | tee subscriptions-stress.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subscriptions-stress-${{ github.run_id }}
          path: subscriptions-stress.log
          if-no-files-found: error
  machine-identity:
    if: inputs.probe == 'machine-identity'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: repeat machine identity and transport tests 100 times
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            for iteration in $(seq 1 100); do
              printf '\nITERATION %s/100\n' "$iteration"
              cargo nextest run -p ovis-terminal-remote --lib --locked --no-tests=fail -E 'test(/identity|transport::/)'
              cargo nextest run -p ovis-terminal-server --lib --locked --no-tests=fail --no-capture -E 'test(/machine_identity::qa/)'
              printf 'PASS %s/100\n' "$iteration"
            done
            printf 'RESULT 100/100\n'
          } 2>&1 | tee machine-identity-stress.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: machine-identity-stress-${{ github.run_id }}
          path: machine-identity-stress.log
          if-no-files-found: error
  ops-cancel:
    if: inputs.probe == 'ops-cancel'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: repeat op.cancel race tests 25 times
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            for iteration in $(seq 1 25); do
              printf '\nITERATION %s/25\n' "$iteration"
              cargo nextest run -p ovis-terminal-server --test ops_cancel --locked --no-tests=fail --no-capture
              printf 'PASS %s/25\n' "$iteration"
            done
            printf 'RESULT 25/25\n'
          } 2>&1 | tee ops-cancel-stress-macos.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-cancel-stress-macos-${{ github.run_id }}
          path: ops-cancel-stress-macos.log
          if-no-files-found: error
  unix-service:
    if: inputs.probe == 'unix-service'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: holder service tests, conformance and a live launchd agent with a private label
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            cargo build --locked -p ovis-terminal-cli --bin ovis-terminal
            for iteration in $(seq 1 10); do
              printf '\nITERATION %s/10\n' "$iteration"
              cargo test --locked -p ovis-terminal-holder --lib service
              cargo run --locked --manifest-path conformance/Cargo.toml --bin conformance -- --binary target/debug/ovis-terminal --scenario platform/unix-service --isolated --case all --evidence "unix-service-$iteration.json"
            done
            session="t51ci$GITHUB_RUN_ID"
            bin=target/debug/ovis-terminal
            "$bin" --json service status --session "$session"
            status=0
            "$bin" --json service install --manager launchd --session "$session" || status=$?
            if test "$status" -eq 0; then
              "$bin" --json service start --manager launchd --session "$session"
              "$bin" --json service status --session "$session" | grep '"state":"running"'
              "$bin" --json service stop --session "$session"
              "$bin" --json service status --session "$session" | grep '"state":"stopped"'
              "$bin" --json service uninstall --manager launchd --session "$session"
              test ! -e "$HOME/Library/LaunchAgents/dev.ovis-terminal.holder.$session.plist"
            else
              printf 'launchd install refused with exit %s; the typed error above names the missing prerequisite\n' "$status"
              test "$status" -eq 4
            fi
            printf 'RESULT pass\n'
          } 2>&1 | tee unix-service-macos.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unix-service-macos-${{ github.run_id }}
          path: unix-service-macos.log
          if-no-files-found: error
  docs-retention:
    if: inputs.probe == 'docs-retention'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: repeat document CAS race and retention tests 50 times
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            for iteration in $(seq 1 50); do
              printf '\nITERATION %s/50\n' "$iteration"
              cargo nextest run -p ovis-terminal-server --test documents_retention --locked --no-tests=fail
              cargo nextest run -p ovis-terminal-core --locked --no-tests=fail -E 'test(/docs::/)'
              printf 'PASS %s/50\n' "$iteration"
            done
            printf 'RESULT 50/50\n'
          } 2>&1 | tee docs-retention-stress-macos.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-retention-stress-macos-${{ github.run_id }}
          path: docs-retention-stress-macos.log
          if-no-files-found: error
  session-binding:
    if: inputs.probe == 'session-binding'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: repeat session binding tests and scenario 25 times
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p ovis-terminal-cli --bin ovis-terminal
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            for iteration in $(seq 1 25); do
              printf '\nITERATION %s/25\n' "$iteration"
              cargo nextest run -p ovis-terminal-agent --locked --no-tests=fail -E 'test(conversation::binding)'
              cargo nextest run -p ovis-terminal-server --test dispatch --locked --no-tests=fail -E 'test(session_binding)'
              cargo run --locked --manifest-path conformance/Cargo.toml --bin conformance -- --binary target/debug/ovis-terminal --scenario agent/binding --isolated --case all --evidence "session-binding-$iteration.json"
              printf 'PASS %s/25\n' "$iteration"
            done
            printf 'RESULT 25/25\n'
          } 2>&1 | tee session-binding-stress-macos.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-binding-stress-macos-${{ github.run_id }}
          path: session-binding-stress-macos.log
          if-no-files-found: error
  conpty:
    if: inputs.probe == 'conpty'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: pin C toolchain (Windows MSVC 14.44)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: "14.44"
      - name: use the pinned MSVC linker
        shell: bash
        run: |
          linker="${VCToolsInstallDir}bin\HostX64\x64\link.exe"
          test -f "$linker"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: native ConPTY terminal and terminal.run admission tests, repeated
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            for iteration in $(seq 1 10); do
              printf '\nITERATION %s/10\n' "$iteration"
              cargo test --locked -p ovis-terminal-holder --lib windows:: -- --nocapture
              cargo test --locked -p ovis-terminal-server --lib conpty
            done
            printf 'RESULT pass\n'
          } 2>&1 | tee conpty-windows.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conpty-windows-${{ github.run_id }}
          path: conpty-windows.log
          if-no-files-found: error
  ops-digest:
    if: inputs.probe == 'ops-digest'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: repeat 1 MiB digest dedup tests 25 times
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            for iteration in $(seq 1 25); do
              printf '\nITERATION %s/25\n' "$iteration"
              cargo nextest run -p ovis-terminal-server --test ops_digest --test documents_retention --locked --no-tests=fail
              cargo nextest run -p ovis-terminal-core --locked --no-tests=fail -E 'test(/digest|params/)'
              printf 'PASS %s/25\n' "$iteration"
            done
            printf 'RESULT 25/25\n'
          } 2>&1 | tee ops-digest-stress-macos.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-digest-stress-macos-${{ github.run_id }}
          path: ops-digest-stress-macos.log
          if-no-files-found: error
  ops-admission:
    if: inputs.probe == 'ops-admission'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
