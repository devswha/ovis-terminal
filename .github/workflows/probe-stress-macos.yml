  windows-service:
    if: inputs.probe == 'windows-service'
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: pin C toolchain (Windows MSVC 14.44)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: "14.44"
      - name: use the pinned MSVC linker
        shell: bash
        run: |
          linker="${VCToolsInstallDir}bin\HostX64\x64\link.exe"
          test -f "$linker"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: CI-owned service account and binary location (no interactive login)
        shell: pwsh
        run: |
          $password = "Ov1s-" + [guid]::NewGuid().ToString("N") + "!a"
          Write-Output "::add-mask::$password"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name ovis54ci -Password $secure -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member ovis54ci
          New-Item -ItemType Directory -Force C:\ovis54\state | Out-Null
          icacls C:\ovis54 /grant "ovis54ci:(OI)(CI)M" | Out-Null
          "OVIS54_ACCOUNT=.\ovis54ci" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OVIS54_PASSWORD=$password" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OVIS54_BINARY=C:\ovis54\ovis-terminal.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OVIS54_STATE=C:\ovis54\state" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: native pipe listener, service host and service fixture tests, repeated
        shell: bash
        run: |
          set -euo pipefail
          {
            uname -a
            rustc --version
            git rev-parse HEAD
            cargo build --locked -p ovis-terminal-cli --bin ovis-terminal
            cp target/debug/ovis-terminal.exe /c/ovis54/ovis-terminal.exe
            for iteration in $(seq 1 3); do
              printf '\nITERATION %s/3\n' "$iteration"
              cargo test --locked -p ovis-terminal-holder --lib service::windows:: -- --nocapture
              cargo test --locked -p ovis-terminal-server --lib -- listen::pipe dispatch::lanes::windows_service
              cargo test --locked -p ovis-terminal-cli --lib service::windows::fixture_tests -- --ignored --nocapture
            done
            printf 'RESULT pass\n'
          } 2>&1 | tee windows-service.log
      - name: remove the fixture service and account
        if: always()
        shell: pwsh
        run: |
          sc.exe stop ovis-terminal-holder-ci54 | Out-Null
          sc.exe delete ovis-terminal-holder-ci54 | Out-Null
          Remove-LocalUser -Name ovis54ci -ErrorAction SilentlyContinue
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-service-${{ github.run_id }}
          path: windows-service.log
          if-no-files-found: error

