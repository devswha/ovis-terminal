name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Job names keep the os label; runner images are pinned so each native C toolchain is fixed.
        include:
          - os: ubuntu-latest
            image: ubuntu-24.04
          - os: macos-latest
            image: macos-15
          - os: windows-latest
            image: windows-2025
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      # Bundled SQLite is C: pin the compiler, archiver and linker per target.
      - name: pin C toolchain (Linux gcc 14.2.0)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test "$(gcc-14 -dumpfullversion)" = "14.2.0"
          {
            echo "CC=gcc-14"
            echo "AR=gcc-ar-14"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc-14"
          } >> "$GITHUB_ENV"
      - name: pin C toolchain (macOS Xcode 16.4)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          # Capture the whole output first: piping into grep -q closes the pipe early and
          # xcodebuild dies of SIGPIPE.
          version="$(xcodebuild -version)"
          test "${version%%$'\n'*}" = "Xcode 16.4"
          clang --version
      - name: pin C toolchain (Windows MSVC 14.44)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: "14.44"
      - name: verify C toolchain (Windows MSVC 14.44)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # cl.exe without arguments prints its banner and a usage error; only the banner matters.
          banner="$(cl.exe 2>&1 || :)"
          [[ "$banner" == *"Version 19.44."* ]]
          # Git Bash puts coreutils /usr/bin/link ahead of MSVC on PATH; give Cargo the
          # pinned toolset's link.exe by absolute path.
          linker="${VCToolsInstallDir}bin\HostX64\x64\link.exe"
          test -f "$linker"
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      # rust-toolchain.toml pins 1.99.1; this installs it with Clippy up front.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: rustfmt (nightly, import grouping)
        run: cargo +nightly fmt --all -- --check
      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: nextest (fails on zero tests)
        run: cargo nextest run --workspace --all-targets --all-features --locked --no-tests=fail
      - name: doctests
        run: cargo test --doc --workspace --all-features --locked
      - name: hygiene (250 pure LOC, 3 parameters)
        run: cargo run --locked --quiet -p workspace-hygiene -- check --root .
      - name: hygiene failure fixture must fail
        shell: bash
        run: |
          set +e
          cargo run --locked --quiet -p workspace-hygiene -- check --fixture excessive-loc-and-parameters
          status=$?
          set -e
          test "$status" -eq 1
      - name: binary version
        shell: bash
        run: |
          out="$(cargo run --locked --quiet -p ovis-terminal-cli -- --version)"
          echo "$out"
          pkgid="$(cargo pkgid -p ovis-terminal-cli)"
          test "$out" = "ovis-terminal ${pkgid##*[#@]}"
      - name: scope note
        shell: bash
        run: |
          {
            echo "### ${{ matrix.os }} ($(uname -sm))"
            echo "Scaffold only: product crates compile and carry no runtime behavior."
            echo "Tests cover the workspace-hygiene checker and the CLI --version path; this is not a tested runtime."
          } >> "$GITHUB_STEP_SUMMARY"

  check-script:
    name: scripts/check.sh (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Bundled SQLite is C: pin the compiler, archiver and linker (gcc 14.2.0 on ubuntu-24.04).
      - name: pin C toolchain (gcc 14.2.0)
        shell: bash
        run: |
          test "$(gcc-14 -dumpfullversion)" = "14.2.0"
          {
            echo "CC=gcc-14"
            echo "AR=gcc-ar-14"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc-14"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: bash scripts/check.sh

  doc:
    name: rustdoc -D warnings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Bundled SQLite is C: pin the compiler, archiver and linker (gcc 14.2.0 on ubuntu-24.04).
      - name: pin C toolchain (gcc 14.2.0)
        shell: bash
        run: |
          test "$(gcc-14 -dumpfullversion)" = "14.2.0"
          {
            echo "CC=gcc-14"
            echo "AR=gcc-ar-14"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc-14"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features --workspace --locked

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Bundled SQLite is C: pin the compiler, archiver and linker (gcc 14.2.0 on ubuntu-24.04).
      - name: pin C toolchain (gcc 14.2.0)
        shell: bash
        run: |
          test "$(gcc-14 -dumpfullversion)" = "14.2.0"
          {
            echo "CC=gcc-14"
            echo "AR=gcc-ar-14"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=gcc-14"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.89 check --workspace --all-targets --all-features --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  machete:
    name: unused dependencies (cargo-machete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete
